name: Deploy BE_XNK

# GitOps: push vào nhánh prod -> kiểm tra -> gọi webhook Portainer -> Portainer pull
# commit mới từ GitHub và build lại stack "be-xnk" trên VM300.
#
# Không dùng self-hosted runner: runner ubuntu-latest chỉ cần gọi được 1 endpoint công khai
# (https://api-xnk.victor.io.vn/deploy-hook), đường này được nginx chặn bằng header X-Deploy-Key
# rồi chuyển tiếp tới webhook nội bộ của Portainer. Xem homelab-IaC/.env mục BE_XNK_DEPLOY_HOOK_KEY.
#
# Secrets cần có trong repo:
#   DEPLOY_HOOK_KEY - khoá mở đường /deploy-hook trên nginx
#   BE_API_KEY      - khoá X-Api-Key của API (dùng để gọi /health sau khi deploy)

on:
  push:
    branches: [prod]
    paths:
      - 'src/**'
      - 'python/**'
      - 'Dockerfile.api'
      - 'Dockerfile.ocr'
      - 'docker-compose.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-be-xnk.yml'
  workflow_dispatch:

# Hai lần deploy chồng nhau sẽ làm Portainer build cùng lúc trên cùng một stack.
concurrency:
  group: deploy-be-xnk
  cancel-in-progress: false

jobs:
  validate:
    name: Kiểm tra trước khi deploy
    runs-on: ubuntu-latest
    outputs:
      src_hash: ${{ steps.src_hash.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cú pháp JavaScript
        run: |
          for f in $(git ls-files 'src/**/*.js'); do
            node --check "$f" || exit 1
          done
          echo "OK: $(git ls-files 'src/**/*.js' | wc -l) file"

      - name: Cú pháp Python (OCR)
        run: python3 -m py_compile python/ocr_server.py

      # Build đúng 2 image mà Portainer sẽ build trên server. Bắt sớm lỗi npm ci,
      # lỗi Dockerfile hay package bị gỡ khỏi registry — trước khi đụng tới prod.
      - name: Build thử image api
        run: docker build -f Dockerfile.api -t be-xnk-api:ci .

      # Đọc thẳng vân tay từ image vừa build, không tính lại bằng tay: hai máy khác
      # nhau chạy find/sort có thể ra thứ tự khác và làm hash lệch một cách vô lý.
      - name: Lấy vân tay mã nguồn
        id: src_hash
        run: |
          value=$(docker run --rm be-xnk-api:ci cat /app/SRC_HASH)
          echo "value=$value" >> $GITHUB_OUTPUT
          echo "Vân tay mã nguồn của bản này: $value"

      - name: Build thử image ocr
        run: docker build -f Dockerfile.ocr -t be-xnk-ocr:ci .

  deploy:
    name: Deploy qua webhook Portainer
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Gọi webhook
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 -X POST \
            -H "X-Deploy-Key: ${{ secrets.DEPLOY_HOOK_KEY }}" \
            https://api-xnk.victor.io.vn/deploy-hook)
          echo "webhook -> HTTP $code"
          [ "$code" = "204" ] || { echo "Webhook không nhận (kỳ vọng 204)"; exit 1; }

      # Portainer trả 204 ngay rồi build/redeploy bất đồng bộ, nên phải tự xác nhận.
      #
      # Xác nhận bằng /version chứ không bằng /health: Portainer từng nuốt lỗi deploy
      # (pull access denied) và trả 204 như bình thường — container cũ vẫn chạy nên
      # /health vẫn xanh và CI báo thành công nhầm. Vân tay mã nguồn thì chỉ đổi khi
      # container thật sự chạy bản mới.
      - name: Chờ /version khớp bản vừa push
        run: |
          want="${{ needs.validate.outputs.src_hash }}"
          [ -n "$want" ] || { echo "Không lấy được vân tay từ job validate"; exit 1; }
          echo "Chờ API báo srcHash = $want"
          sleep 20   # chừa thời gian cho Portainer build xong rồi mới hỏi

          for i in $(seq 1 30); do
            got=$(curl -sS -m 10 -H "X-Api-Key: ${{ secrets.BE_API_KEY }}" \
              https://api-xnk.victor.io.vn/version \
              | sed -n 's/.*"srcHash":"\([^"]*\)".*/\1/p' || true)
            echo "[$i] đang chạy=${got:-<không đọc được>} | kỳ vọng=$want"
            if [ "$got" = "$want" ]; then
              echo "✅ Container đang chạy đúng mã nguồn vừa push"
              health=$(curl -sS -m 10 -H "X-Api-Key: ${{ secrets.BE_API_KEY }}" \
                https://api-xnk.victor.io.vn/health || true)
              echo "$health"
              echo "$health" | grep -q '"database":"ok"' \
                || { echo "❌ Đã deploy nhưng database không ok"; exit 1; }
              exit 0
            fi
            sleep 10
          done
          echo "❌ Sau 5 phút API vẫn chạy mã nguồn cũ — Portainer không deploy."
          echo "   Kiểm tra: docker logs portainer trên VM300 (lỗi deploy bị nuốt, chỉ hiện ở đó)."
          exit 1
