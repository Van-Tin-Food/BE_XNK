# Stack BE_XNK: api (Node) + ocr (Python/Tesseract).
# Biến môi trường đọc từ file .env đặt cạnh file này - xem .env.example.
# Hướng dẫn đầy đủ: DEPLOY.md

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: be-xnk-api:latest
    container_name: be-xnk-api
    restart: unless-stopped
    # tini làm PID 1: chuyển tiếp SIGTERM cho Node (app có xử lý graceful
    # shutdown) và dọn tiến trình zombie.
    init: true
    ports:
      - "${API_PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-25mb}

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL: ${DB_SSL:-false}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}

      APPSCRIPT_URL: ${APPSCRIPT_URL}
      APPS_SCRIPT_TIMEOUT: ${APPS_SCRIPT_TIMEOUT:-120000}

      # Gọi service ocr qua DNS nội bộ của Compose, không qua localhost.
      PYTHON_OCR_URL: http://ocr:8001
      CARRIER_FETCH_TIMEOUT: ${CARRIER_FETCH_TIMEOUT:-30000}
    depends_on:
      - ocr
    healthcheck:
      # /health kiểm tra cả kết nối database, trả 503 khi DB hỏng.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ocr:
    build:
      context: .
      dockerfile: Dockerfile.ocr
    image: be-xnk-ocr:latest
    container_name: be-xnk-ocr
    restart: unless-stopped
    init: true
    # Không mở ports ra ngoài: service này không có xác thực, chỉ api được gọi.
    expose:
      - "8001"
    environment:
      PYTHON_OCR_HOST: 0.0.0.0
      PYTHON_OCR_PORT: 8001
      open_router_key: ${open_router_key}
      OPENROUTER_MODEL_OCR: ${OPENROUTER_MODEL_OCR:-openai/gpt-4o-mini}
      appscript_key: ${APPSCRIPT_URL}
    # OCR xử lý ảnh tới 8 triệu pixel và render PDF ở 200 DPI. ThreadingHTTPServer
    # không giới hạn số luồng nên nhiều file lớn cùng lúc sẽ cộng dồn bộ nhớ.
    # Gặp exit code 137 (OOM) thì nâng giá trị này - xem DEPLOY.md mục 10.5.
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
